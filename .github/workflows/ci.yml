name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  packages:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: vendor/bin/pint --test
      - run: vendor/bin/phpstan analyse --memory-limit=1G
      - run: vendor/bin/rector --dry-run
      - run: vendor/bin/pest

  app:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: ladcms_test
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -ppassword" --health-interval=10s --health-timeout=5s --health-retries=5
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: composer install --no-interaction --prefer-dist
      - run: composer types:check
      - run: cp .env.example .env && php artisan key:generate
      # Generated Wayfinder files are git-ignored; types:check needs them.
      - run: php artisan wayfinder:generate --with-form
      - run: npm ci
      - run: npm run check
      - run: npm run types:check
      - run: npm run build
      - run: php artisan test
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_DATABASE: ladcms_test
          DB_USERNAME: root
          DB_PASSWORD: password
          SESSION_DRIVER: array
          CACHE_STORE: array
          QUEUE_CONNECTION: sync
